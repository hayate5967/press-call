; PlatformIO の設定（ADR：ファームの開発環境は PlatformIO＋Arduino）
; ESP32 向けのビルドと、PC 上で判定ロジックを試す native テストの 2 つの環境を持つ

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

; PC 上で動かすテスト用（pio test -e native）。Arduino に依存しない lib/detection だけを使う
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
